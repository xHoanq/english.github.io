async function api(prompt) {
  // 1. Tự động lấy Key đã lưu trong trình duyệt của bạn ra dùng
  let KEY = localStorage.getItem('gemini_key');

  // 2. Nếu chưa có Key, trang web sẽ hiện một ô thông báo nhỏ để bạn nhập vào
  if (!KEY || KEY.length < 10) {
    KEY = prompt("Vui lòng nhập/dán Gemini API Key mới của bạn vào đây:");
    if (KEY) {
      localStorage.setItem('gemini_key', KEY.trim());
    } else {
      alert("Bạn cần nhập API Key để ứng dụng có thể tạo câu hỏi!");
      return null;
    }
  }

  // URL kết nối chuẩn tới Google Gemini phiên bản ổn định nhất
  const URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${KEY}`;

  try {
    const response = await fetch(URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        contents: [{ parts: [{ text: prompt }] }]
      })
    });

    const data = await response.json();

    // Nếu Key bị lỗi (403 hoặc 401), xóa Key lỗi đó đi để bạn nhập lại Key mới
    if (!response.ok) {
      if (response.status === 403 || response.status === 401) {
        localStorage.removeItem('gemini_key');
        throw new Error("API Key của bạn đã bị Google khóa hoặc không hợp lệ. Vui lòng F5 tải lại trang để nhập Key mới!");
      }
      throw new Error(data.error?.message || "Lỗi kết nối API");
    }

    const resultText = data.candidates[0].content.parts[0].text;
    const cleanedJson = resultText.replace(/```json\n?/g, '').replace(/```/g, '').trim();
    return JSON.parse(cleanedJson);
  } catch (error) {
    console.error("Lỗi hệ thống:", error);
    alert("⚠️ " + error.message);
    throw error;
  }
}

  return api(`Bạn là giáo viên tiếng Anh. Tạo 10 câu hỏi quiz từ vựng cho Unit "${u.id}: ${u.voc}" sách Destination B1.
Dùng các từ này: ${u.vocWords}
Câu hỏi đa dạng: nghĩa tiếng Việt của từ tiếng Anh, hoặc ngược lại, hoặc điền từ vào câu ví dụ.
Mỗi câu: 4 đáp án (1 đúng, 3 sai nhưng liên quan chủ đề).
Chỉ trả về JSON, không thêm gì:
{"questions":[{"question":"Từ 'confident' có nghĩa tiếng Việt là gì?","options":["tự tin","nhút nhát","hào phóng","tức giận"],"correct":0,"explanation":"'Confident' = tự tin. Ví dụ: She spoke in a confident voice."}]}`);
}

async function genExam(u) {
  return api(`Bạn là giáo viên tiếng Anh. Tạo 6 câu hỏi kiểm tra ngữ pháp và từ vựng cho Unit "${u.id}" sách Destination B1.
Chủ đề từ vựng: ${u.voc}. Ngữ pháp: ${u.gram}.
Câu hỏi về: dùng đúng thì, chọn từ đúng, cấu trúc câu đúng.
Từ vựng dùng: ${u.vocWords.split(',').slice(0,8).join(',')}
Chỉ trả về JSON:
{"questions":[{"question":"She _____ confident during the interview.","options":["was","is being","has been","had been"],"correct":0,"explanation":"Dùng 'was' (quá khứ đơn) vì diễn tả trạng thái trong quá khứ."}]}`);
}

async function genPassage(u) {
  return api(`Bạn là giáo viên tiếng Anh. Tạo bài đọc điền từ cho Unit "${u.id}: ${u.voc}" sách Destination B1.
Dùng các từ này làm từ cần điền (chọn 7): ${u.vocWords}
Đoạn văn tiếng Anh 100-130 từ về chủ đề "${u.voc}", có 7 chỗ trống [BLANK_1] đến [BLANK_7].
Ngân hàng từ gồm 10 từ (7 đúng + 3 nhiễu liên quan chủ đề).
Chỉ trả về JSON:
{"passage":"Every year many people choose to [BLANK_1]...","blanks":["travel","destination","journey","experience","culture","explore","luggage","flight","hotel","adventure"],"answers":{"BLANK_1":"travel","BLANK_2":"destination","BLANK_3":"journey","BLANK_4":"experience","BLANK_5":"culture","BLANK_6":"explore","BLANK_7":"luggage"},"translation":"Hàng năm nhiều người chọn đi du lịch..."}`);
}

function set(u){Object.assign(S,u);render()}

function render(){document.getElementById('root').innerHTML=S.view==='home'?home():unit();attach()}

function home(){
  return `
  <div class="hdr">
    <div class="hdr-icon">📚</div>
    <div>
      <h1>Destination B1 — Grammar & Vocabulary</h1>
      <p>42 units • Quiz từ vựng • Bài thi • Đoạn văn điền từ</p>
    </div>
  </div>
  <div class="stitle">Chọn unit để bắt đầu luyện tập</div>
  <div class="grid">
  ${UNITS.map(u=>`<div class="ucard" data-uid="${u.id}">
    <div class="unum">Unit ${u.id}</div>
    <div class="uvoc">📖 ${u.voc}</div>
    <div class="ugram">📐 ${u.gram}</div>
  </div>`).join('')}
  </div>`;
}

function unit(){
  const u=UNITS[S.uid-1];
  let body='';
  if(S.loading) body=`<div class="ld"><div class="spin"></div><p>AI đang tạo nội dung cho Unit ${u.id}...</p></div>`;
  else if(S.err) body=`<div class="err">⚠️ ${S.err}<button class="rbtn" id="rbtn">Thử lại</button></div>`;
  else if(S.feat==='quiz') body=quiz(u);
  else if(S.feat==='exam') body=exam(u);
  else body=passage(u);
  return `<div class="uv">
  <div class="uhdr">
    <button class="bbtn" id="bbtn">← Tất cả units</button>
    <div class="uinfo">
      <h2>Unit ${u.id}: ${u.voc}</h2>
      <div class="voc-sub">📖 Từ vựng: ${u.voc}</div>
      <div class="gram-sub">📐 Ngữ pháp: ${u.gram}</div>
    </div>
  </div>
  <div class="ftabs">
    <div class="ftab ${S.feat==='quiz'?'on':''}" data-f="quiz"><span class="ficon">🧠</span>Quiz từ vựng</div>
    <div class="ftab ${S.feat==='exam'?'on':''}" data-f="exam"><span class="ficon">📝</span>Bài thi</div>
    <div class="ftab ${S.feat==='passage'?'on':''}" data-f="passage"><span class="ficon">📄</span>Đoạn văn điền từ</div>
  </div>
  ${body}</div>`;
}

function quiz(u){
  if(!S.qd) return `<div class="empty-state">
    <div class="es-icon">🧠</div>
    <h3>Quiz từ vựng — Unit ${u.id}</h3>
    <p>5 câu hỏi về từ vựng chủ đề <strong>${u.voc}</strong><br>Đa dạng: nghĩa tiếng Việt, đoán từ, điền vào câu</p>
    <button class="gbtn" id="gq">✨ Tạo câu hỏi Quiz ngay</button>
  </div>`;
  const q=S.qd.questions[S.qi],tot=S.qd.questions.length,L=['A','B','C','D'];
  let h=`<div class="qct">Câu ${S.qi+1}/${tot}</div>
  <div class="qq" style="margin-top:10px">${q.question}</div>
  <div class="opts">`;
  q.options.forEach((o,i)=>{
    let c='opt';
    if(S.qsel!==null){c+=' dis';if(i===q.correct)c+=' ok';else if(i===S.qsel&&i!==q.correct)c+=' ng';}
    h+=`<div class="${c}" data-o="${i}"><div class="olet">${L[i]}</div><span>${o}</span></div>`;
  });
  h+=`</div>`;
  if(S.qsel!==null) h+=`<div class="expl">💡 <strong>Giải thích:</strong> ${q.explanation}</div>`;
  h+=`<div class="qnav">
    <button class="nbtn" id="pq" ${S.qi===0?'disabled':''}>← Trước</button>
    <span class="qct">${S.qsel===null?'Chọn đáp án của bạn':'✓ Đã trả lời'}</span>
    <button class="nbtn" id="nq" ${S.qi>=tot-1?'disabled':''}>Tiếp →</button>
  </div>`;
  if(S.qi===tot-1&&S.qsel!==null) h+=`<button class="gbtn" id="gq" style="margin-top:12px">🔄 Tạo quiz mới</button>`;
  return h;
}

function exam(u){
  if(!S.ed) return `<div class="empty-state">
    <div class="es-icon">📝</div>
    <h3>Bài thi — Unit ${u.id}</h3>
    <p>6 câu hỏi kết hợp từ vựng <strong>${u.voc}</strong><br>và ngữ pháp <strong>${u.gram}</strong></p>
    <button class="gbtn" id="ge">✨ Tạo bài thi ngay</button>
  </div>`;
  const L=['A','B','C','D'];let h='';
  if(S.esubmit){
    const ok=S.ed.questions.filter((q,i)=>S.eans[i]===q.correct).length,tot=S.ed.questions.length,pct=Math.round(ok/tot*100);
    h+=`<div class="sc"><div class="sb">${ok}/${tot}</div><div class="sl2">${pct}% — ${pct>=80?'Xuất sắc! 🎉':pct>=60?'Khá tốt! 👍':'Cần luyện thêm 💪'}</div></div>`;
  }
  S.ed.questions.forEach((q,qi)=>{
    h+=`<div class="eq"><div class="eqn">Câu ${qi+1}</div><div class="eqt">${q.question}</div>`;
    q.options.forEach((o,oi)=>{
      let c='eo';
      if(S.eans[qi]===oi)c+=' sel';
      if(S.esubmit){c+=' dis';if(oi===q.correct)c+=' ok';else if(S.eans[qi]===oi)c+=' ng';}
      h+=`<div class="${c}" data-qi="${qi}" data-oi="${oi}">${L[oi]}. ${o}</div>`;
    });
    if(S.esubmit) h+=`<div class="expl" style="margin-top:9px">💡 ${q.explanation}</div>`;
    h+=`</div>`;
  });
  if(!S.esubmit){
    const a=Object.keys(S.eans).length,tot=S.ed.questions.length;
    h+=`<button class="esub" id="esub" ${a<tot?'disabled':''}>Nộp bài (${a}/${tot} câu đã trả lời)</button>`;
  } else {
    h+=`<button class="gbtn" id="ge" style="margin-top:12px">🔄 Tạo bài thi mới</button>`;
  }
  return h;
}

function passage(u){
  if(!S.pd) return `<div class="empty-state">
    <div class="es-icon">📄</div>
    <h3>Đoạn văn điền từ — Unit ${u.id}</h3>
    <p>Đọc đoạn văn về chủ đề <strong>${u.voc}</strong><br>và điền từ thích hợp vào chỗ trống</p>
    <button class="gbtn" id="gp">✨ Tạo đoạn văn ngay</button>
  </div>`;
  const d=S.pd,bkeys=Object.keys(d.answers);
  let ptxt=d.passage;
  bkeys.forEach(bk=>{
    const f=S.pans[bk];
    let c='blk';
    if(S.psubmit) c+=f===d.answers[bk]?' ok2':' ng2';
    else if(S.pact===bk) c+=' act';
    ptxt=ptxt.replace('['+bk+']',`<span class="${c}" data-b="${bk}">${f||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`);
  });
  let h='';
  if(S.pact&&!S.psubmit) h+=`<div class="hint">✏️ Đang điền vào <strong>${S.pact}</strong> — nhấn chọn từ bên dưới</div>`;
  h+=`<div class="pbox">${ptxt}</div>`;
  h+=`<div class="stitle">Ngân hàng từ (chọn từ để điền)</div><div class="wbank">`;
  d.blanks.forEach(w=>{
    const used=Object.values(S.pans).includes(w);
    const issel=S.pact&&S.pans[S.pact]===w;
    h+=`<div class="wchip ${issel?'sel':used&&!issel?'used':''}" data-w="${w}">${w}</div>`;
  });
  h+=`</div>`;
  if(!S.psubmit){
    const f=Object.keys(S.pans).length,tot=bkeys.length;
    h+=`<button class="psub" id="psub" ${f<tot?'style="opacity:.55;cursor:not-allowed"':''}>✓ Kiểm tra đáp án (${f}/${tot})</button>`;
  } else {
    const ok=bkeys.filter(b=>S.pans[b]===d.answers[b]).length;
    h+=`<div class="sc" style="margin-top:14px"><div class="sb">${ok}/${bkeys.length}</div><div class="sl2">Điền đúng ${ok} từ trong tổng số ${bkeys.length}</div></div>`;
    h+=`<div class="ans-sec"><h4>Đáp án đúng</h4><div>`;
    bkeys.forEach(b=>{
      const ok2=S.pans[b]===d.answers[b];
      h+=`<div class="ai"><span>${ok2?'✅':'❌'}</span><span><strong>${b}:</strong> ${d.answers[b]}${!ok2&&S.pans[b]?' (bạn điền: '+S.pans[b]+')':''}</span></div>`;
    });
    h+=`</div></div>`;
    if(d.translation) h+=`<div style="margin-top:12px;padding:13px;background:var(--sur2);border-radius:var(--r);border:2px solid var(--bd)"><div class="stitle">Dịch nghĩa đoạn văn</div><p style="font-size:13px;line-height:1.7;color:var(--t2)">${d.translation}</p></div>`;
    h+=`<button class="gbtn" id="gp" style="margin-top:12px">🔄 Tạo đoạn văn mới</button>`;
  }
  return h;
}

function attach(){
  document.querySelectorAll('.ucard[data-uid]').forEach(el=>el.addEventListener('click',()=>
    set({view:'unit',uid:+el.dataset.uid,feat:'quiz',qd:null,qi:0,qsel:null,ed:null,eans:{},esubmit:false,pd:null,pans:{},psubmit:false,pact:null,loading:false,err:null})));
  const bb=document.getElementById('bbtn');if(bb)bb.addEventListener('click',()=>set({view:'home'}));
  document.querySelectorAll('.ftab[data-f]').forEach(el=>el.addEventListener('click',()=>
    set({feat:el.dataset.f,qsel:null,esubmit:false,psubmit:false,pact:null,err:null})));
  const rb=document.getElementById('rbtn');if(rb)rb.addEventListener('click',()=>set({err:null}));

  const gq=document.getElementById('gq');
  if(gq)gq.addEventListener('click',async()=>{
    const u=UNITS[S.uid-1];set({loading:true,err:null,qd:null,qi:0,qsel:null});
    try{const d=await genQuiz(u);set({loading:false,qd:d});}
    catch(e){set({loading:false,err:e.message});}
  });
  const ge=document.getElementById('ge');
  if(ge)ge.addEventListener('click',async()=>{
    const u=UNITS[S.uid-1];set({loading:true,err:null,ed:null,eans:{},esubmit:false});
    try{const d=await genExam(u);set({loading:false,ed:d});}
    catch(e){set({loading:false,err:e.message});}
  });
  const gp=document.getElementById('gp');
  if(gp)gp.addEventListener('click',async()=>{
    const u=UNITS[S.uid-1];set({loading:true,err:null,pd:null,pans:{},psubmit:false,pact:null});
    try{const d=await genPassage(u);set({loading:false,pd:d});}
    catch(e){set({loading:false,err:e.message});}
  });

  document.querySelectorAll('.opt[data-o]').forEach(el=>el.addEventListener('click',()=>{
    if(S.qsel!==null)return;set({qsel:+el.dataset.o});
  }));
  const pq=document.getElementById('pq');if(pq)pq.addEventListener('click',()=>set({qi:S.qi-1,qsel:null}));
  const nq=document.getElementById('nq');if(nq)nq.addEventListener('click',()=>set({qi:S.qi+1,qsel:null}));

  document.querySelectorAll('.eo[data-qi]').forEach(el=>el.addEventListener('click',()=>{
    if(S.esubmit)return;set({eans:{...S.eans,[+el.dataset.qi]:+el.dataset.oi}});
  }));
  const es=document.getElementById('esub');
  if(es)es.addEventListener('click',()=>{
    if(Object.keys(S.eans).length>=S.ed.questions.length)set({esubmit:true});
  });

  document.querySelectorAll('.blk[data-b]').forEach(el=>el.addEventListener('click',()=>{
    if(S.psubmit)return;set({pact:el.dataset.b});
  }));
  document.querySelectorAll('.wchip[data-w]').forEach(el=>el.addEventListener('click',()=>{
    if(S.psubmit||!S.pact)return;
    const w=el.dataset.w,used=Object.values(S.pans).includes(w),cur=S.pans[S.pact];
    if(used&&cur!==w)return;
    const na={...S.pans};
    if(cur===w){delete na[S.pact];}
    else{const ob=Object.keys(na).find(k=>na[k]===w);if(ob)delete na[ob];na[S.pact]=w;}
    set({pans:na,pact:null});
  }));
  const ps=document.getElementById('psub');
  if(ps)ps.addEventListener('click',()=>{
    if(Object.keys(S.pans).length>=Object.keys(S.pd.answers).length)set({psubmit:true});
  });
}

render();
</script>
</body>
</html>
