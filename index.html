
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--p:#2563eb;--pl:#dbeafe;--pd:#1d4ed8;--s:#16a34a;--sl:#dcfce7;--d:#dc2626;--dl:#fee2e2;--w:#d97706;--wl:#fef3c7;--bg:#eef2ff;--sur:#fff;--sur2:#f8fafc;--t:#1e293b;--t2:#64748b;--t3:#94a3b8;--bd:#e2e8f0;--r:12px;--rs:8px;--gram:#7c3aed;--graml:#ede9fe;--voc:#0369a1;--vocl:#e0f2fe}
body{font-family:'Be Vietnam Pro',sans-serif;background:var(--bg);color:var(--t);min-height:100vh}
.app{max-width:980px;margin:0 auto;padding:16px}
.hdr{background:linear-gradient(135deg,#1e3a8a,#2563eb 60%,#3b82f6);border-radius:18px;padding:22px 24px;margin-bottom:18px;color:#fff;display:flex;align-items:center;gap:16px;box-shadow:0 4px 24px rgba(37,99,235,.25)}
.hdr-icon{font-size:44px}
.hdr h1{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;margin-bottom:3px}
.hdr p{font-size:12px;opacity:.85;line-height:1.5}
.legend{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.leg{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700}
.leg-dot{width:12px;height:12px;border-radius:3px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:9px}
.ucard{border:2px solid var(--bd);border-radius:var(--r);padding:12px 10px;cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.ucard.gram{background:#faf5ff;border-color:#c4b5fd}
.ucard.voc{background:#f0f9ff;border-color:#7dd3fc}
.ucard:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.1)}
.ucard.gram:hover{border-color:var(--gram)}
.ucard.voc:hover{border-color:var(--voc)}
.ucard::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.ucard.gram::before{background:linear-gradient(90deg,var(--gram),#a78bfa)}
.ucard.voc::before{background:linear-gradient(90deg,var(--voc),#38bdf8)}
.unum{font-family:'Nunito',sans-serif;font-size:20px;font-weight:900;line-height:1}
.ucard.gram .unum{color:var(--gram)}
.ucard.voc .unum{color:var(--voc)}
.utag{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.4px;padding:2px 6px;border-radius:8px;margin-top:4px;display:inline-block}
.ucard.gram .utag{background:var(--graml);color:var(--gram)}
.ucard.voc .utag{background:var(--vocl);color:var(--voc)}
.utitle{font-size:11px;color:var(--t2);margin-top:5px;line-height:1.35;font-weight:600}
.uv{background:var(--sur);border-radius:var(--r);border:2px solid var(--bd);padding:20px}
.uhdr{display:flex;align-items:flex-start;gap:12px;margin-bottom:18px;padding-bottom:14px;border-bottom:2px solid var(--bd)}
.bbtn{background:var(--sur2);border:2px solid var(--bd);border-radius:var(--rs);padding:8px 14px;cursor:pointer;font-size:13px;font-weight:700;color:var(--t2);transition:.2s;white-space:nowrap;flex-shrink:0}
.bbtn:hover{border-color:var(--p);color:var(--p)}
.uinfo h2{font-family:'Nunito',sans-serif;font-size:17px;font-weight:900;line-height:1.3}
.uinfo.gram h2{color:var(--gram)}
.uinfo.voc h2{color:var(--voc)}
.utype-badge{font-size:11px;font-weight:800;padding:3px 10px;border-radius:10px;display:inline-block;margin-bottom:6px}
.gram .utype-badge{background:var(--graml);color:var(--gram)}
.voc .utype-badge{background:var(--vocl);color:var(--voc)}
.ftabs{display:flex;gap:8px;margin-bottom:18px}
.ftab{flex:1;padding:10px 6px;border:2px solid var(--bd);border-radius:var(--rs);cursor:pointer;text-align:center;font-size:12px;font-weight:700;color:var(--t2);transition:.2s;background:var(--sur2)}
.ftab.on{background:var(--p);border-color:var(--p);color:#fff}
.ftab:hover:not(.on){border-color:var(--p);color:var(--p)}
.ficon{font-size:18px;display:block;margin-bottom:3px}
.gbtn{width:100%;padding:13px;background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;border:none;border-radius:var(--r);font-size:14px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:8px}
.gbtn:hover{opacity:.92;transform:translateY(-1px)}
.es{text-align:center;padding:28px 16px}
.es .ei{font-size:48px;margin-bottom:12px}
.es h3{font-size:15px;font-weight:700;margin-bottom:6px}
.es p{font-size:13px;color:var(--t2);margin-bottom:18px;line-height:1.5}
.ld{text-align:center;padding:40px}
.spin{width:34px;height:34px;border:3px solid var(--bd);border-top-color:var(--p);border-radius:50%;animation:sp .8s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.ld p{font-size:13px;color:var(--t2);font-weight:600}
.qq{background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:var(--r);padding:15px;margin-bottom:13px;font-size:14px;font-weight:700;color:#1e3a8a;line-height:1.6;border-left:4px solid var(--p)}
.opts{display:grid;gap:9px}
.opt{padding:11px 13px;border:2px solid var(--bd);border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;transition:.2s;background:var(--sur);display:flex;align-items:center;gap:9px}
.opt:hover:not(.dis){border-color:var(--p);background:var(--pl)}
.opt.ok{border-color:var(--s);background:var(--sl);color:#14532d;font-weight:600}
.opt.ng{border-color:var(--d);background:var(--dl);color:#7f1d1d}
.opt.dis{cursor:default}
.olet{width:26px;height:26px;border-radius:50%;background:var(--bd);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;flex-shrink:0}
.opt.ok .olet{background:var(--s);color:#fff}
.opt.ng .olet{background:var(--d);color:#fff}
.expl{margin-top:11px;padding:12px;background:#f0fdf4;border-radius:var(--rs);border-left:4px solid var(--s);font-size:13px;color:#166534;line-height:1.6}
.qnav{display:flex;align-items:center;justify-content:space-between;margin-top:13px}
.nbtn{padding:7px 16px;border-radius:var(--rs);border:2px solid var(--p);background:var(--sur);color:var(--p);font-size:13px;font-weight:700;cursor:pointer;transition:.2s}
.nbtn:hover:not(:disabled){background:var(--p);color:#fff}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.qct{font-size:13px;color:var(--t2);font-weight:600}
.eq{background:var(--sur);border:2px solid var(--bd);border-radius:var(--r);padding:14px;margin-bottom:10px}
.eqn{font-size:10px;color:var(--t3);font-weight:700;text-transform:uppercase;margin-bottom:6px}
.eqt{font-size:14px;font-weight:600;margin-bottom:10px;line-height:1.6}
.eo{padding:9px 12px;border:2px solid var(--bd);border-radius:var(--rs);cursor:pointer;font-size:13px;transition:.2s;display:flex;align-items:center;gap:7px;margin-bottom:6px;font-weight:500}
.eo:last-child{margin-bottom:0}
.eo:hover:not(.dis){border-color:var(--p);background:var(--pl)}
.eo.sel{border-color:var(--p);background:var(--pl);font-weight:600}
.eo.ok{border-color:var(--s);background:var(--sl);color:#14532d}
.eo.ng{border-color:var(--d);background:var(--dl);color:#7f1d1d}
.eo.dis{cursor:default}
.esub{margin-top:13px;padding:11px;background:var(--p);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:.2s}
.esub:hover{background:var(--pd)}
.esub:disabled{opacity:.5;cursor:not-allowed}
.sc{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff;border-radius:var(--r);padding:18px;text-align:center;margin-bottom:13px}
.sb{font-size:44px;font-weight:900;font-family:'Nunito',sans-serif}
.sl2{font-size:13px;opacity:.85;margin-top:3px;font-weight:600}
.pbox{background:#f8fafc;border:2px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:13px;font-size:14px;line-height:2.3}
.blk{display:inline-block;min-width:80px;border-bottom:2px solid var(--p);margin:0 3px;text-align:center;cursor:pointer;font-weight:700;color:var(--p);padding:1px 7px;background:var(--pl);border-radius:4px 4px 0 0;transition:.15s}
.blk.act{outline:2px solid var(--p);outline-offset:2px}
.blk.ok2{background:var(--sl);border-color:var(--s);color:#14532d}
.blk.ng2{background:var(--dl);border-color:var(--d);color:#7f1d1d}
.wbank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:13px}
.wchip{padding:5px 12px;border:2px solid var(--bd);border-radius:18px;cursor:pointer;font-size:13px;font-weight:600;background:var(--sur);transition:.2s}
.wchip:hover:not(.used){border-color:var(--p);color:var(--p);background:var(--pl)}
.wchip.sel{border-color:var(--p);background:var(--p);color:#fff}
.wchip.used{opacity:.32;cursor:default}
.psub{padding:10px 20px;background:var(--s);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;transition:.2s}
.psub:hover{background:#15803d}
.ans-sec{margin-top:13px;padding:13px;background:var(--sur2);border-radius:var(--r);border:2px solid var(--bd)}
.ans-sec h4{font-size:12px;font-weight:800;margin-bottom:8px;text-transform:uppercase;letter-spacing:.4px;color:var(--t2)}
.ai{display:flex;align-items:center;gap:7px;font-size:13px;padding:3px 0}
.err{background:var(--dl);border:2px solid var(--d);border-radius:var(--r);padding:13px;font-size:13px;color:var(--d);font-weight:600}
.rbtn{padding:8px 16px;background:var(--sur);border:2px solid var(--d);color:var(--d);border-radius:var(--rs);font-size:13px;font-weight:600;cursor:pointer;margin-top:9px;transition:.2s}
.rbtn:hover{background:var(--d);color:#fff}
.stitle{font-size:11px;font-weight:800;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px}
.hint{background:var(--wl);border-radius:var(--rs);padding:7px 11px;font-size:12px;color:#92400e;font-weight:600;margin-bottom:11px}
</style>
</head>

async function api(promptText) {
  let KEY = localStorage.getItem('gemini_key');

  if (!KEY || KEY.length < 10) {
    KEY = window.prompt("Vui lòng dán Gemini API Key mới của bạn vào đây:");
    if (KEY) localStorage.setItem('gemini_key', KEY);
    else return;
  }

  // DANH SÁCH MODEL THỰC TẾ ĐANG HOẠT ĐỘNG (Thử nghiệm tuần tự để sửa dứt điểm lỗi Not Found)
  const MODELS = [
    "gemini-2.5-flash",
    "gemini-1.5-flash-002",
    "gemini-1.5-flash-8b",
    "gemini-1.5-flash"
  ];

  let lastError = null;

  for (const modelName of MODELS) {
    const URL = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${KEY}`;
    
    try {
      console.log(`Đang thử kết nối qua model: ${modelName}...`);
      const response = await fetch(URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: [{ parts: [{ text: promptText }] }],
          generationConfig: {
            response_mime_type: "application/json"
          }
        })
      });

      const data = await response.json();

      // Nếu API key hỏng hoàn toàn (Lỗi 403/401) -> Báo người dùng nhập lại luôn, không thử tiếp
      if (response.status === 403 || response.status === 401) {
        localStorage.removeItem('gemini_key');
        alert("⚠️ API Key của bạn không đúng hoặc đã hết hạn. Hãy F5 trang để nhập lại Key chính xác từ Google AI Studio.");
        return null;
      }

      // Nếu lỗi 404 (Không tìm thấy model) hoặc lỗi không hỗ trợ -> Bỏ qua, thử model tiếp theo trong danh sách
      if (!response.ok) {
        console.warn(`Model ${modelName} lỗi hoặc không được hỗ trợ. Đang chuyển model...`);
        lastError = data.error?.message || "Lỗi không xác định";
        continue; 
      }

      // Nếu phản hồi thành công, xử lý chuỗi và trả kết quả ngay lập tức
      if (data.candidates && data.candidates[0]?.content?.parts[0]?.text) {
        const resultText = data.candidates[0].content.parts[0].text;
        const cleanedJson = resultText.replace(/```json\n?/g, '').replace(/```/g, '').trim();
        return JSON.parse(cleanedJson);
      }

    } catch (err) {
      console.error(`Gặp lỗi khi chạy model ${modelName}:`, err);
      lastError = err.message;
      // Tiếp tục vòng lặp sang các model dự phòng tiếp theo
    }
  }

  // Nếu duyệt qua toàn bộ danh sách mà vẫn lỗi thì mới xuất thông báo cuối cùng
  alert(`❌ Tất cả các model đều thất bại. Lỗi cuối cùng ghi nhận: ${lastError}\n\nVui lòng kiểm tra lại xem API Key của bạn đã được tạo đúng trong Google AI Studio chưa.`);
  throw new Error("Tất cả các phiên bản model đều không khả dụng.");
}

function buildQuiz(u){
  const isGram=u.type==='gram';
  if(!S.qd)return `<div class="es"><div class="ei">${isGram?'📐':'📖'}</div>
    <h3>Quiz ${isGram?'ngữ pháp':'từ vựng'} — Unit ${u.id}</h3>
    <p>5 câu hỏi về <strong>${u.title}</strong></p>
    <button class="gbtn" id="gq">✨ Tạo Quiz</button></div>`;
  const q=S.qd.questions[S.qi],tot=S.qd.questions.length,L=['A','B','C','D'];
  let h=`<div class="qct">Câu ${S.qi+1}/${tot}</div><div class="qq" style="margin-top:9px">${q.question}</div><div class="opts">`;
  q.options.forEach((o,i)=>{
    let c='opt';if(S.qsel!==null){c+=' dis';if(i===q.correct)c+=' ok';else if(i===S.qsel&&i!==q.correct)c+=' ng';}
    h+=`<div class="${c}" data-o="${i}"><div class="olet">${L[i]}</div><span>${o}</span></div>`;
  });
  h+=`</div>`;
  if(S.qsel!==null)h+=`<div class="expl">💡 <strong>Giải thích:</strong> ${q.explanation}</div>`;
  h+=`<div class="qnav"><button class="nbtn" id="pq" ${S.qi===0?'disabled':''}>← Trước</button>
    <span class="qct">${S.qsel===null?'Chọn đáp án':'✓ Đã trả lời'}</span>
    <button class="nbtn" id="nq" ${S.qi>=tot-1?'disabled':''}>Tiếp →</button></div>`;
  if(S.qi===tot-1&&S.qsel!==null)h+=`<button class="gbtn" id="gq" style="margin-top:11px">🔄 Tạo quiz mới</button>`;
  return h;
}

function buildExam(u){
  const isGram=u.type==='gram';
  if(!S.ed)return `<div class="es"><div class="ei">${isGram?'📐':'📖'}</div>
    <h3>Bài thi ${isGram?'ngữ pháp':'từ vựng'} — Unit ${u.id}</h3>
    <p>6 câu hỏi về <strong>${u.title}</strong></p>
    <button class="gbtn" id="ge">✨ Tạo bài thi</button></div>`;
  const L=['A','B','C','D'];let h='';
  if(S.esub){const ok=S.ed.questions.filter((q,i)=>S.eans[i]===q.correct).length,tot=S.ed.questions.length,pct=Math.round(ok/tot*100);
    h+=`<div class="sc"><div class="sb">${ok}/${tot}</div><div class="sl2">${pct}% — ${pct>=80?'Xuất sắc! 🎉':pct>=60?'Khá tốt! 👍':'Cần luyện thêm 💪'}</div></div>`;}
  S.ed.questions.forEach((q,qi)=>{
    h+=`<div class="eq"><div class="eqn">Câu ${qi+1}</div><div class="eqt">${q.question}</div>`;
    q.options.forEach((o,oi)=>{
      let c='eo';if(S.eans[qi]===oi)c+=' sel';
      if(S.esub){c+=' dis';if(oi===q.correct)c+=' ok';else if(S.eans[qi]===oi)c+=' ng';}
      h+=`<div class="${c}" data-qi="${qi}" data-oi="${oi}">${L[oi]}. ${o}</div>`;
    });
    if(S.esub)h+=`<div class="expl" style="margin-top:8px">💡 ${q.explanation}</div>`;
    h+=`</div>`;
  });
  if(!S.esub){const a=Object.keys(S.eans).length,tot=S.ed.questions.length;
    h+=`<button class="esub" id="esub" ${a<tot?'disabled':''}>Nộp bài (${a}/${tot})</button>`;}
  else h+=`<button class="gbtn" id="ge" style="margin-top:11px">🔄 Tạo bài thi mới</button>`;
  return h;
}

function buildPassage(u){
  const isGram=u.type==='gram';
  if(!S.pd)return `<div class="es"><div class="ei">📄</div>
    <h3>Đoạn văn điền từ — Unit ${u.id}</h3>
    <p>${isGram?`Đoạn văn dùng cấu trúc <strong>${u.title}</strong>`:`Đoạn văn chủ đề <strong>${u.title}</strong>`}</p>
    <button class="gbtn" id="gp">✨ Tạo đoạn văn</button></div>`;
  const d=S.pd,bkeys=Object.keys(d.answers);
  let ptxt=d.passage;
  bkeys.forEach(bk=>{
    const f=S.pans[bk];let c='blk';
    if(S.psub)c+=f===d.answers[bk]?' ok2':' ng2';
    else if(S.pact===bk)c+=' act';
    ptxt=ptxt.replace('['+bk+']',`<span class="${c}" data-b="${bk}">${f||'&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;'}</span>`);
  });
  let h='';
  if(S.pact&&!S.psub)h+=`<div class="hint">✏️ Đang điền <strong>${S.pact}</strong> — chọn từ bên dưới</div>`;
  h+=`<div class="pbox">${ptxt}</div>`;
  h+=`<div class="stitle">Ngân hàng từ</div><div class="wbank">`;
  d.blanks.forEach(w=>{
    const used=Object.values(S.pans).includes(w),issel=S.pact&&S.pans[S.pact]===w;
    h+=`<div class="wchip ${issel?'sel':used&&!issel?'used':''}" data-w="${w}">${w}</div>`;
  });
  h+=`</div>`;
  if(!S.psub){const f=Object.keys(S.pans).length,tot=bkeys.length;
    h+=`<button class="psub" id="psub" ${f<tot?'style="opacity:.55;cursor:not-allowed"':''}>✓ Kiểm tra (${f}/${tot})</button>`;}
  else{
    const ok=bkeys.filter(b=>S.pans[b]===d.answers[b]).length;
    h+=`<div class="sc" style="margin-top:13px"><div class="sb">${ok}/${bkeys.length}</div><div class="sl2">Điền đúng ${ok}/${bkeys.length}</div></div>`;
    h+=`<div class="ans-sec"><h4>Đáp án</h4>`;
    bkeys.forEach(b=>{const ok2=S.pans[b]===d.answers[b];h+=`<div class="ai"><span>${ok2?'✅':'❌'}</span><span><strong>${b}:</strong> ${d.answers[b]}${!ok2&&S.pans[b]?' (bạn: '+S.pans[b]+')':''}</span></div>`;});
    h+=`</div>`;
    if(d.translation)h+=`<div style="margin-top:11px;padding:12px;background:var(--sur2);border-radius:var(--rs);border:2px solid var(--bd)"><div class="stitle">Dịch nghĩa</div><p style="font-size:13px;line-height:1.7;color:var(--t2)">${d.translation}</p></div>`;
    h+=`<button class="gbtn" id="gp" style="margin-top:11px">🔄 Tạo đoạn văn mới</button>`;
  }
  return h;
}

function attach(){
  document.querySelectorAll('.ucard[data-uid]').forEach(el=>el.addEventListener('click',()=>
    set({view:'unit',uid:+el.dataset.uid,feat:'quiz',qd:null,qi:0,qsel:null,ed:null,eans:{},esub:false,pd:null,pans:{},psub:false,pact:null,loading:false,err:null})));
  const bb=document.getElementById('bbtn');if(bb)bb.addEventListener('click',()=>set({view:'home'}));
  document.querySelectorAll('.ftab[data-f]').forEach(el=>el.addEventListener('click',()=>
    set({feat:el.dataset.f,qsel:null,esub:false,psub:false,pact:null,err:null})));
  const rb=document.getElementById('rbtn');if(rb)rb.addEventListener('click',()=>set({err:null}));
  const gq=document.getElementById('gq');
  if(gq)gq.addEventListener('click',async()=>{
    const u=UNITS[S.uid-1];set({loading:true,err:null,qd:null,qi:0,qsel:null});
    try{const d=await genQuiz(u);set({loading:false,qd:d});}catch(e){set({loading:false,err:e.message});}
  });
  const ge=document.getElementById('ge');
  if(ge)ge.addEventListener('click',async()=>{
    const u=UNITS[S.uid-1];set({loading:true,err:null,ed:null,eans:{},esub:false});
    try{const d=await genExam(u);set({loading:false,ed:d});}catch(e){set({loading:false,err:e.message});}
  });
  const gp=document.getElementById('gp');
  if(gp)gp.addEventListener('click',async()=>{
    const u=UNITS[S.uid-1];set({loading:true,err:null,pd:null,pans:{},psub:false,pact:null});
    try{const d=await genPassage(u);set({loading:false,pd:d});}catch(e){set({loading:false,err:e.message});}
  });
  document.querySelectorAll('.opt[data-o]').forEach(el=>el.addEventListener('click',()=>{
    if(S.qsel!==null)return;set({qsel:+el.dataset.o});
  }));
  const pq=document.getElementById('pq');if(pq)pq.addEventListener('click',()=>set({qi:S.qi-1,qsel:null}));
  const nq=document.getElementById('nq');if(nq)nq.addEventListener('click',()=>set({qi:S.qi+1,qsel:null}));
  document.querySelectorAll('.eo[data-qi]').forEach(el=>el.addEventListener('click',()=>{
    if(S.esub)return;set({eans:{...S.eans,[+el.dataset.qi]:+el.dataset.oi}});
  }));
  const es=document.getElementById('esub');
  if(es)es.addEventListener('click',()=>{if(Object.keys(S.eans).length>=S.ed.questions.length)set({esub:true});});
  document.querySelectorAll('.blk[data-b]').forEach(el=>el.addEventListener('click',()=>{
    if(S.psub)return;set({pact:el.dataset.b});
  }));
  document.querySelectorAll('.wchip[data-w]').forEach(el=>el.addEventListener('click',()=>{
    if(S.psub||!S.pact)return;
    const w=el.dataset.w,used=Object.values(S.pans).includes(w),cur=S.pans[S.pact];
    if(used&&cur!==w)return;
    const na={...S.pans};
    if(cur===w){delete na[S.pact];}else{const ob=Object.keys(na).find(k=>na[k]===w);if(ob)delete na[ob];na[S.pact]=w;}
    set({pans:na,pact:null});
  }));
  const ps=document.getElementById('psub');
  if(ps)ps.addEventListener('click',()=>{if(Object.keys(S.pans).length>=Object.keys(S.pd.answers).length)set({psub:true});});
}
render();
</script>
</body>
</html>
